# Rookie's Revenge — nightly playtest in the cloud.
#
# Successor to the LOCAL crontab entry (scripts/run-revenge-nightly.sh), which
# only fired while Tyler's Mac was awake. This runs on GitHub's machines at
# 06:30 UTC (2:30am ET) every night regardless: full harness -> digest ->
# Slack summary -> commit + push, same as the local wrapper.
#
# Manual run: Actions tab -> "Revenge nightly" -> Run workflow (quick=true
# for a 2-minute smoke).

name: Revenge nightly

on:
  schedule:
    # 04:30 UTC (= 12:30am ET). GitHub cron can fire hours late on busy
    # shared runners (2026-09-02: the 06:30 fire came at 11:33), so start
    # early enough that even a late, slow run lands before morning.
    - cron: '30 4 * * *'
    # TEMP (2026-09-02): Tyler's laptop-closed proof fire at 6pm ET. GitHub cron
    # can run late; expect the fire between 6:00-7:00pm. REMOVE after tonight.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick 2-minute smoke instead of the full harness'
        type: boolean
        default: false

concurrency:
  group: revenge-nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run the harness
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # GitHub's hosted runners have ~4 cores vs the dev Mac's 10+, so run
          # a reduced budget (~half trials) or the full harness takes 4-6h
          # (2026-09-02: the first full-budget fire ran past 3h). Noise grows
          # from about +/-10 to +/-14 points per cell — fine for a nightly
          # trend read; verify borderline calls locally at full budget.
          # Budget resized 2026-09-02: the live pool doubled (11 runs x 25 ability
          # loadouts). 16 trials/cell keeps the sweep ~2-2.5h on the 4-core runner
          # (noise ~+/-17/cell — trend-read only; verify borderline calls locally).
          # player-runs stays 24: the new-player clear rate is the headline number.
          FLAGS="--trials=16 --mode-trials=8 --runs=16 --player-runs=24 --cand-trials=16 --cand-mode-trials=8 --cand-runs=12 --cand-player-runs=12 --exp-trials=16"
          if [ "${{ inputs.quick }}" = "true" ]; then FLAGS="--quick"; fi
          npx tsx scripts/run-playtest/revenge-nightly.ts $FLAGS

      - name: Post Slack summary
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          RAW="data/run-playtest/revenge/raw/$TODAY"
          if [ -n "$SLACK_WEBHOOK_URL" ] && [ -f "$RAW/slack.txt" ]; then
            PAYLOAD=$(python3 -c 'import json,sys; print(json.dumps({"text": open(sys.argv[1]).read().strip()}))' "$RAW/slack.txt")
            curl -sS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" \
              && echo "slack posted" || echo "warn: slack post failed"
          else
            echo "slack skipped (no webhook or no slack.txt)"
          fi

      - name: Commit digests and push
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          RAW="data/run-playtest/revenge/raw/$TODAY"
          git config user.name "Rookie Playtest Bot"
          git config user.email "playtest@rookies-run.local"
          git add data/run-playtest/revenge/digests/
          RAW_BYTES=$(du -sk "$RAW" 2>/dev/null | cut -f1)
          if [ -n "$RAW_BYTES" ] && [ "$RAW_BYTES" -lt 2048 ]; then
            git add "$RAW"/*.json || true
          else
            echo "raw dir is ${RAW_BYTES:-?} KB — committing digests only"
          fi
          git add data/run-playtest/revenge/experiments.jsonl || true
          git add data/content/pipeline.json || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Rookie's Revenge: nightly playtest digest $TODAY (GitHub Actions)"
            # Drop uncommitted leftovers (e.g. raw dirs over the 2MB cap) so rebase is clean.
            git restore .
            git clean -fd data/run-playtest/revenge/raw
            git pull --rebase origin main
            git push origin main
          fi

  # Combo-gate discovery (2026-09-05, Tyler: "find more combinations of
  # abilities and build a LOT of levels"). Independent job so it never delays
  # the playtest digest. Generates terrain candidates, screens them against
  # 4-card kits, and files levels that no single kit card beats but one pair
  # does under data/run-playtest/combo-library/ (SYNERGY.md = the pair map).
  # The ledger makes nightly runs additive: least-tried pairs first. The seed
  # is the day-of-year so each night explores different candidates.
  combo-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Discover combo-gated levels
        run: |
          npx tsx scripts/run-playtest/combo-discover.ts --from-terrain --slots=7-10 --variants=20 --max-kits=8 --jobs=3 --minutes=150 --seed=$(date -u +%j)
      - name: Commit the library and push
        run: |
          git config user.name "Rookie Playtest Bot"
          git config user.email "playtest@rookies-run.local"
          git add data/run-playtest/combo-library/ || true
          if git diff --cached --quiet; then
            echo "nothing new discovered"
          else
            N=$(ls -d data/run-playtest/combo-library/*+*/ 2>/dev/null | wc -l | tr -d ' ')
            git commit -m "Rookie's Revenge: nightly combo discovery $(date -u +%Y-%m-%d) ($N gating pairs in library)"
            git restore .
            git pull --rebase origin main
            git push origin main
          fi
