# Rookie's Revenge — nightly playtest in the cloud.
#
# Jobs:
#   plan             reads LADDER_RUNG_IDS from code -> the matrix + tonight's date
#   ladder-rung      ONE JOB PER RUNG (2026-09-12). A rung takes ~45 min on a
#                    4-core runner, so ten in a row is 7.5 h and the single job
#                    timed out at 240 min every night after the 2026-09-09
#                    audit (Sep 10/11/12). The repo is public = Actions minutes
#                    are free and 20 jobs run at once, so the ladder now
#                    finishes in about one rung's time. Each shard runs the
#                    sims + the spec.ts audit for its rung and uploads raw/.
#   ladder-merge     downloads every shard -> one graded ladder-audit result
#                    (one fingerprint, one INDEX row) -> digest -> Slack ->
#                    commit + push. The ladder is the product (Tyler,
#                    2026-09-09), so it is the only thing graded nightly.
#                    Candidate (testing-stage) runs are NOT swept here: the
#                    pool grew to 38 runs and the old all-runs sweep timed out
#                    at 350 min ten nights in a row (2026-09-04..09) without a
#                    word to anyone. Grade a candidate by hand:
#                      npx tsx scripts/run-playtest/revenge-nightly.ts --runs-filter=<id>
#   combo-discovery  files combo-gated levels under data/run-playtest/combo-library/
#
# A failed or timed-out ladder job POSTS TO SLACK. Silence is never success.
#
# Manual run: Actions tab -> "Revenge nightly" -> Run workflow (quick=true
# for a smoke; rung=N to grade a single rung — the morning tuning routine
# uses this to re-grade one rung after a change).

name: Revenge nightly

on:
  schedule:
    # 04:30 UTC (= 12:30am ET). GitHub cron can fire hours late on busy
    # shared runners, so start early enough that a late, slow run still lands
    # before morning.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick smoke instead of the full harness'
        type: boolean
        default: false
      rung:
        description: 'Grade only this 1-based ladder rung (blank = all)'
        type: string
        default: ''

concurrency:
  group: revenge-nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rungs: ${{ steps.plan.outputs.rungs }}
      date: ${{ steps.plan.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: plan
        run: |
          # The rung list comes from code so this file never holds a second copy.
          N=$(npx tsx -e "import('./lib/run/ladder').then(m => console.log(m.LADDER_RUNG_IDS.length))")
          ONLY="${{ inputs.rung }}"
          if [ -n "$ONLY" ]; then
            RUNGS="[$ONLY]"
          else
            RUNGS=$(node -e "console.log(JSON.stringify(Array.from({length:$N},(_,i)=>i+1)))")
          fi
          echo "rungs=$RUNGS" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "ladder: $N rungs -> shards $RUNGS"

  ladder-rung:
    needs: plan
    runs-on: ubuntu-latest
    # Measured 2026-09-13 (first sharded night): sims ~45 min + the spec audit
    # at BUDGET.nightly (48 trials) = 55-110 min for nine rungs, and rung 7
    # (revenge-25, The Alcove) ran past 150 min and was cancelled. Shards are
    # free, parallel jobs, so the cap is generous; if one trips THIS, the
    # rung's games are pathologically long — look at the run, not the cap.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        rung: ${{ fromJson(needs.plan.outputs.rungs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sims + spec audit for rung ${{ matrix.rung }}
        run: |
          # Noise per cell is roughly +/-17 points at 16 trials — the digest is
          # a TREND read; the graded verdict comes from the spec audit below
          # it, which carries its own 95% interval.
          FLAGS="--shard=${{ matrix.rung }} --from=${{ needs.plan.outputs.date }} --jobs=4 --trials=16 --mode-trials=8 --runs=16 --player-runs=24 --exp-trials=16"
          if [ "${{ inputs.quick }}" = "true" ]; then FLAGS="--quick $FLAGS"; fi
          npx tsx scripts/run-playtest/revenge-nightly.ts $FLAGS

      - name: Upload this rung's raw JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-rung-${{ matrix.rung }}
          path: data/run-playtest/revenge/raw/${{ needs.plan.outputs.date }}/
          retention-days: 30
          if-no-files-found: ignore

  ladder-merge:
    needs: [plan, ladder-rung]
    # Run even when a shard failed: the digest says which rungs are missing,
    # and the failure alert below still fires for the failed shards' status.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download every shard
        uses: actions/download-artifact@v4
        with:
          pattern: raw-rung-*
          merge-multiple: true
          path: data/run-playtest/revenge/raw/${{ needs.plan.outputs.date }}/

      - name: Merge shards -> graded ladder -> digest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ls data/run-playtest/revenge/raw/${{ needs.plan.outputs.date }}/ | head -50
          FLAGS="--merge --from=${{ needs.plan.outputs.date }} --jobs=4 --trials=16 --mode-trials=8 --runs=16 --player-runs=24 --exp-trials=16"
          if [ "${{ inputs.quick }}" = "true" ]; then FLAGS="--quick $FLAGS"; fi
          npx tsx scripts/run-playtest/revenge-nightly.ts $FLAGS

      - name: Post Slack summary
        # A branch re-grade reports through the routine that asked for it, not here.
        if: github.ref == 'refs/heads/main'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          RAW="data/run-playtest/revenge/raw/${{ needs.plan.outputs.date }}"
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "slack skipped (no webhook)"; exit 0; fi
          if [ ! -f "$RAW/slack.txt" ]; then
            echo "harness produced no slack.txt — treating as failure"
            exit 1
          fi
          PAYLOAD=$(python3 -c 'import json,sys; print(json.dumps({"text": open(sys.argv[1]).read().strip()}))' "$RAW/slack.txt")
          curl -sS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" \
            && echo "slack posted" || echo "warn: slack post failed"

      - name: Commit digests and push
        # Only from main: a rung re-grade dispatched on a tuning branch
        # (--ref <branch> -f rung=N) must never push that branch into main.
        if: github.ref == 'refs/heads/main'
        run: |
          TODAY=${{ needs.plan.outputs.date }}
          git config user.name "Rookie Playtest Bot"
          git config user.email "playtest@rookies-run.local"
          git add data/run-playtest/revenge/digests/
          git add data/run-playtest/results/ || true
          git add data/run-playtest/revenge/experiments.jsonl || true
          git add data/content/pipeline.json || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Rookie's Revenge: nightly ladder digest $TODAY (GitHub Actions, sharded)"
            # Raw JSON is kept as a workflow artifact (below), never committed
            # and never deleted here: the old `git restore . && git clean` step
            # threw away anything the harness left behind.
            git stash --include-untracked -q || true
            # Someone pushes during the run most nights (2026-09-09: the
            # smoke's rebase died on pipeline.json + latest.md). The nightly's
            # files are the nightly's: on a conflicting hunk keep tonight's
            # version (-X theirs = the commit being replayed), then retry the
            # push a few times in case another push lands in between.
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push origin main; then break; fi
              echo "push attempt $attempt failed — retrying"
              git rebase --abort 2>/dev/null || true
              sleep 20
            done
          fi

      - name: Keep the merged raw JSON as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revenge-raw-${{ github.run_id }}
          path: data/run-playtest/revenge/raw/
          retention-days: 30
          if-no-files-found: ignore

      - name: Alert Slack on failure
        if: failure() || cancelled() || needs.ladder-rung.result != 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          MSG="NIGHTLY PROBLEM — Rookie's Revenge ladder: shards ended ${{ needs.ladder-rung.result }}, merge ended ${{ job.status }} (shard timeout 150 min, merge 120). Check which rungs are missing from the digest. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(python3 -c 'import json,sys; print(json.dumps({"text": sys.argv[1]}))' "$MSG")
          curl -sS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || true

  # Combo-gate discovery (2026-09-05, Tyler: "find more combinations of
  # abilities and build a LOT of levels"). Independent job so it never delays
  # the ladder digest. Generates terrain candidates, screens them against
  # 4-card kits, and files levels that no single kit card beats but one pair
  # does (60-80%) under data/run-playtest/combo-library/ (SYNERGY.md = the pair
  # map). The ledger makes nightly runs additive: least-tried pairs first. The
  # seed is the day-of-year so each night explores different candidates.
  combo-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Discover combo-gated levels
        run: |
          npx tsx scripts/run-playtest/combo-discover.ts --from-terrain --slots=7-10 --variants=20 --max-kits=8 --jobs=3 --minutes=150 --seed=$(date -u +%j)
      - name: Commit the library and push
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "Rookie Playtest Bot"
          git config user.email "playtest@rookies-run.local"
          git add data/run-playtest/combo-library/ || true
          if git diff --cached --quiet; then
            echo "nothing new discovered"
          else
            N=$(ls -d data/run-playtest/combo-library/*+*/ 2>/dev/null | wc -l | tr -d ' ')
            git commit -m "Rookie's Revenge: nightly combo discovery $(date -u +%Y-%m-%d) ($N gating pairs in library)"
            git stash --include-untracked -q || true
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push origin main; then break; fi
              echo "push attempt $attempt failed — retrying"
              git rebase --abort 2>/dev/null || true
              sleep 20
            done
          fi
      - name: Alert Slack on failure
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          MSG="NIGHTLY FAILED — combo-discovery job ended ${{ job.status }}. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(python3 -c 'import json,sys; print(json.dumps({"text": sys.argv[1]}))' "$MSG")
          curl -sS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || true
